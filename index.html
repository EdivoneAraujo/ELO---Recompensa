<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Token ELO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-2xl mx-auto space-y-6">

    <!-- CABEÇALHO -->
    <header class="flex justify-between items-center bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg">
      <div>
        <h1 class="text-2xl font-bold text-amber-400 flex items-center gap-2">
          <img src="imagens/Logo.png" alt="Logo" class="w-8 h-8 object-contain">
          Token ELO
        </h1>
        <p class="text-xs text-slate-400 mt-1">Valorizando o Desempenho Acadêmico</p>
      </div>
      <button id="btnConnect" onclick="conectarCarteira()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-4 py-2 rounded-xl transition-all shadow-md">
        Conectar MetaMask
      </button>
    </header>
    <!-- INFORMAÇÕES DA CONTA E SALDO -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
        <span class="text-slate-400 text-xs uppercase font-semibold">Carteira Conectada</span>
        <p id="userAddress" class="text-sm font-mono mt-1 text-slate-300 truncate">Não conectada</p>
      </div>
      <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
        <span class="text-slate-400 text-xs uppercase font-semibold">Seu Saldo ELO</span>
        <p id="userBalance" class="text-2xl font-bold mt-1 text-amber-400">0 ELO</p>
      </div>
    </div>

    <!-- SEÇÃO: CONCEDER RECOMPENSA (PROFESSOR / REWARDER) -->
    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-md">
      <h2 class="text-lg font-bold text-slate-100 mb-4 flex items-center gap-2">
        <span>🏆</span> Conceder ELO (Recompensa)
      </h2>
      <div class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Endereço do Aluno (0x...)</label>
          <input type="text" id="alunoAddress" placeholder="0x..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-amber-500">
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Quantidade (ELO)</label>
            <input type="number" id="alunoQtd" placeholder="Ex: 50" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Motivo</label>
            <input type="text" id="alunoMotivo" placeholder="Ex: Excelente nota na prova" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-amber-500">
          </div>
        </div>
        <button onclick="concederElo()" class="w-full bg-slate-700 hover:bg-slate-600 text-amber-400 font-semibold py-2.5 rounded-xl transition-all border border-amber-500/30">
          Enviar Recompensa
        </button>
      </div>
    </div>
    <!-- SEÇÃO: RESGATAR BENEFÍCIO (ALUNO) -->
    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-md">
      <h2 class="text-lg font-bold text-slate-100 mb-4 flex items-center gap-2">
        <span>🛍️</span> Resgatar Benefício
      </h2>
      <div class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Quantidade de ELO</label>
            <input type="number" id="resgateQtd" placeholder="Ex: 100" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Nome do Benefício</label>
            <input type="text" id="resgateNome" placeholder="Ex: Ponto extra em Matemática" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-amber-500">
          </div>
        </div>
        <button onclick="resgatarBeneficio()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2.5 rounded-xl transition-all shadow-md">
          Resgatar Benefício
        </button>
      </div>
    </div>
    <!-- FEEDBACK DE STATUS -->
    <div id="statusBox" class="hidden p-4 rounded-xl text-sm border"></div>
  </div>
  <script>
    // Configurações do Contrato ELO
    const CONTRACT_ADDRESS = "0x72B38AbdC5Fddc58d3477D41C83ea74C6483535F";
    const ABI = [
        "function balanceOf(address account) external view returns (uint256)",
        "function concederElo(address aluno, uint256 quantidade, string calldata motivo) external",
        "function resgatarBeneficio(uint256 quantidade, string calldata beneficio) external"
      ];

    let provider, signer, contract;

    async function conectarCarteira() {
      if (!window.ethereum) return mostrarStatus("Instale a MetaMask para continuar.", "erro");

      try {
        provider = new ethers.BrowserProvider(window.ethereum);
        await provider.send("eth_requestAccounts", []);

        // Garante que está na Sepolia (ChainID: 11155111)
        const network = await provider.getNetwork();
        if (network.chainId !== 11155111n) {
          mostrarStatus("Por favor, mude a rede da sua MetaMask para a Sepolia!", "erro");
          return;
        }

        signer = await provider.getSigner();
        const address = await signer.getAddress();
        contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);

        document.getElementById("userAddress").innerText = `${address.substring(0,6)}...${address.substring(38)}`;
        document.getElementById("btnConnect").innerText = "Conectado";
        document.getElementById("btnConnect").classList.replace("bg-amber-500", "bg-emerald-600");

        atualizarSaldo(address);
        mostrarStatus("Carteira conectada com sucesso!", "sucesso");
      } catch (err) {
        mostrarStatus("Erro ao conectar: " + err.message, "erro");
      }
    }

    async function atualizarSaldo(address) {
      try {
        const balance = await contract.balanceOf(address);
        const formatted = ethers.formatUnits(balance, 18);
        document.getElementById("userBalance").innerText = `${parseFloat(formatted).toLocaleString("pt-BR")} ELO`;
      } catch (err) {
        console.error("Erro ao ler saldo:", err);
      }
    }

    async function concederElo() {
      if (!contract) return mostrarStatus("Conecte a carteira primeiro!", "erro");

      const aluno = document.getElementById("alunoAddress").value;
      const qtd = document.getElementById("alunoQtd").value;
      const motivo = document.getElementById("alunoMotivo").value;

      if (!aluno || !qtd || !motivo) return mostrarStatus("Preencha todos os campos da recompensa.", "erro");

      try {
        mostrarStatus("Aguardando confirmação na MetaMask...", "info");
        const qtdWei = ethers.parseUnits(qtd, 18);
        const tx = await contract.concederElo(aluno, qtdWei, motivo);
        mostrarStatus("Transação enviada! Aguardando mineração...", "info");
        await tx.wait();

        mostrarStatus(`Sucesso! ${qtd} ELO concedido ao aluno.`, "sucesso");
        atualizarSaldo(await signer.getAddress());
      } catch (err) {
        mostrarStatus("Falha na transação: " + (err.reason || err.message), "erro");
      }
    }

    async function resgatarBeneficio() {
      if (!contract) return mostrarStatus("Conecte a carteira primeiro!", "erro");

      const qtd = document.getElementById("resgateQtd").value;
      const beneficio = document.getElementById("resgateNome").value;

      if (!qtd || !beneficio) return mostrarStatus("Preencha todos os campos do resgate.", "erro");

      try {
        mostrarStatus("Aguardando confirmação na MetaMask...", "info");
        const qtdWei = ethers.parseUnits(qtd, 18);
        const tx = await contract.resgatarBeneficio(qtdWei, beneficio);
        mostrarStatus("Processando resgate na blockchain...", "info");
        await tx.wait();

        mostrarStatus(`Sucesso! Benefício "${beneficio}" resgatado.`, "sucesso");
        atualizarSaldo(await signer.getAddress());
      } catch (err) {
        mostrarStatus("Falha ao resgatar: " + (err.reason || err.message), "erro");
      }
    }

    function mostrarStatus(mensagem, tipo) {
      const box = document.getElementById("statusBox");
      box.classList.remove("hidden", "bg-red-900/40", "border-red-500", "text-red-300", "bg-emerald-900/40", "border-emerald-500", "text-emerald-300", "bg-sky-900/40", "border-sky-500", "text-sky-300");

      if (tipo === "erro") {
        box.classList.add("bg-red-900/40", "border-red-500", "text-red-300");
      } else if (tipo === "sucesso") {
        box.classList.add("bg-emerald-900/40", "border-emerald-500", "text-emerald-300");
      } else {
        box.classList.add("bg-sky-900/40", "border-sky-500", "text-sky-300");
      }

      box.innerText = mensagem;
    }
  </script>
</body>
</html>
